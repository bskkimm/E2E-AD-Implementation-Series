files: ^(GameFormer_from_Scratch/|\.github/workflows/gameformer\.yml$)
repos:
  - repo: local
    hooks:
      - id: gameformer-file-hygiene
        name: GameFormer whitespace, formats, conflicts, keys, size, notebook outputs
        language: system
        entry: python GameFormer_from_Scratch/scripts/hygiene.py
        types: [file]
