name: GameFormer CPU verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gameformer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: gameformer/${{ matrix.stage }}/py${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {stage: pre-commit, python: '3.11'}
          - {stage: lint-format, python: '3.11'}
          - {stage: types, python: '3.11'}
          - {stage: unit, python: '3.11'}
          - {stage: unit, python: '3.12'}
          - {stage: integration, python: '3.11'}
          - {stage: integration, python: '3.12'}
          - {stage: notebook, python: '3.11'}
          - {stage: package, python: '3.11'}
          - {stage: dependencies, python: '3.11'}
          - {stage: docs-config, python: '3.11'}
    defaults:
      run:
        working-directory: GameFormer_from_Scratch
    env:
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      MPLBACKEND: Agg
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked CPU dependencies
        run: |
          python -m pip install uv==0.11.16
          uv sync --frozen --extra dev --extra tracking
      - name: Run independent check
        env:
          CHECK_STAGE: ${{ matrix.stage }}
        run: uv run --frozen --extra dev --extra tracking python scripts/check_all.py --stage "$CHECK_STAGE" --timeout 900
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gameformer-${{ matrix.stage }}-py${{ matrix.python }}
          path: GameFormer_from_Scratch/outputs/checks/
          if-no-files-found: warn
          retention-days: 14
  required-checks:
    name: GameFormer required checks
    if: always()
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every matrix check to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ['NEEDS_JSON'])
          failed = {key: job['result'] for key, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required checks did not succeed: {failed}')
          print('Every GameFormer check succeeded.')
          PY
