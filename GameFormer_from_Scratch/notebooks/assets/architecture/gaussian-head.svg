<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
<rect width="1100" height="620" fill="#f5f7fb"/>
<g font-family="DejaVu Sans" fill="#172336">
<text x="32" y="43" font-size="25" font-weight="bold" fill="#172336">Offsets, uncertainty and mode scores</text>
<text x="33" y="74" font-size="14" font-weight="normal" fill="#172336">Each stage: [B,P,M,T,4] = mu_x,mu_y,log_sigma_x,log_sigma_y.</text>
<rect x="32" y="128" width="336" height="362" rx="12" fill="#e7eefb" stroke="#2c518c" stroke-width="1.5"/>
<text x="49" y="164" font-size="17" font-weight="bold" fill="#2c518c">Toy selected timestep</text>
<text x="49" y="207" font-size="15" font-weight="normal" fill="#172336">Current xy = (10,2) m</text>
<text x="49" y="244" font-size="15" font-weight="normal" fill="#172336">Head offset = (3,1) m</text>
<text x="49" y="281" font-size="15" font-weight="normal" fill="#172336">Raw log std = (0, ln 2)</text>
<text x="49" y="318" font-size="15" font-weight="normal" fill="#172336">Separate scalar score head</text>
<rect x="397" y="128" width="336" height="362" rx="12" fill="#fff0d8" stroke="#805100" stroke-width="1.5"/>
<text x="414" y="164" font-size="17" font-weight="bold" fill="#805100">Anchor to current state</text>
<text x="414" y="207" font-size="15" font-weight="normal" fill="#172336">Mean = current + offset</text>
<text x="414" y="244" font-size="15" font-weight="normal" fill="#172336">mu = (13,3) m</text>
<text x="414" y="281" font-size="15" font-weight="normal" fill="#172336">sigma = exp(log sigma)</text>
<text x="414" y="318" font-size="15" font-weight="normal" fill="#172336">sigma = (1,2) m</text>
<rect x="762" y="128" width="336" height="362" rx="12" fill="#e1f4e9" stroke="#24633e" stroke-width="1.5"/>
<text x="779" y="164" font-size="17" font-weight="bold" fill="#24633e">Keep meanings distinct</text>
<text x="779" y="207" font-size="15" font-weight="normal" fill="#172336">Offsets are from current xy</text>
<text x="779" y="244" font-size="15" font-weight="normal" fill="#172336">No cumulative-sum decoder</text>
<text x="779" y="281" font-size="15" font-weight="normal" fill="#172336">Log std is not variance</text>
<text x="779" y="318" font-size="15" font-weight="normal" fill="#172336">Softmax scores across modes</text>
<path d="M371 310 H388 M381 304 L389 310 L381 316" stroke="#536783" stroke-width="2.5" fill="none"/>
<path d="M736 310 H753 M746 304 L754 310 L746 316" stroke="#536783" stroke-width="2.5" fill="none"/>
<text x="33" y="528" font-size="14" font-weight="normal" fill="#172336">Blue: inputs   |   Amber: operation   |   Green: result / interpretation</text>
<text x="33" y="558" font-size="14" font-weight="normal" fill="#172336">Worked toy values explain the computation; they are not trained-model measurements.</text>
<text x="33" y="588" font-size="12" font-weight="normal" fill="#172336">Source: gameformer/model.py  |  Figure: gaussian-head</text>
</g></svg>
