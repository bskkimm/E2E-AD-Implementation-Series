<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
<rect width="1100" height="620" fill="#f5f7fb"/>
<g font-family="DejaVu Sans" fill="#172336">
<text x="32" y="43" font-size="25" font-weight="bold" fill="#172336">Masked channel-wise max pooling</text>
<text x="33" y="74" font-size="14" font-weight="normal" fill="#172336">Full: lane groups of 10; crosswalk groups of 10 in the released recipe.</text>
<rect x="32" y="128" width="336" height="362" rx="12" fill="#e7eefb" stroke="#2c518c" stroke-width="1.5"/>
<text x="49" y="164" font-size="17" font-weight="bold" fill="#2c518c">Toy three-point group</text>
<text x="49" y="207" font-size="15" font-weight="normal" fill="#172336">Point A: (1,4), valid</text>
<text x="49" y="244" font-size="15" font-weight="normal" fill="#172336">Point B: (7,2), valid</text>
<text x="49" y="281" font-size="15" font-weight="normal" fill="#172336">Padding: (99,99), invalid</text>
<text x="49" y="318" font-size="15" font-weight="normal" fill="#172336">Toy width D=2</text>
<rect x="397" y="128" width="336" height="362" rx="12" fill="#fff0d8" stroke="#805100" stroke-width="1.5"/>
<text x="414" y="164" font-size="17" font-weight="bold" fill="#805100">Exclude, then reduce</text>
<text x="414" y="207" font-size="15" font-weight="normal" fill="#172336">Mask padding to -infinity</text>
<text x="414" y="244" font-size="15" font-weight="normal" fill="#172336">Channel 0 winner: B -&gt; 7</text>
<text x="414" y="281" font-size="15" font-weight="normal" fill="#172336">Channel 1 winner: A -&gt; 4</text>
<text x="414" y="318" font-size="15" font-weight="normal" fill="#172336">Pooled feature = (7,4)</text>
<rect x="762" y="128" width="336" height="362" rx="12" fill="#e1f4e9" stroke="#24633e" stroke-width="1.5"/>
<text x="779" y="164" font-size="17" font-weight="bold" fill="#24633e">Mask policy matters</text>
<text x="779" y="207" font-size="15" font-weight="normal" fill="#172336">Strict: partial group hidden</text>
<text x="779" y="244" font-size="15" font-weight="normal" fill="#172336">Practical: retain valid points</text>
<text x="779" y="281" font-size="15" font-weight="normal" fill="#172336">Empty group -&gt; feature (0,0)</text>
<text x="779" y="318" font-size="15" font-weight="normal" fill="#172336">Empty group always hidden</text>
<path d="M371 310 H388 M381 304 L389 310 L381 316" stroke="#536783" stroke-width="2.5" fill="none"/>
<path d="M736 310 H753 M746 304 L754 310 L746 316" stroke="#536783" stroke-width="2.5" fill="none"/>
<text x="33" y="528" font-size="14" font-weight="normal" fill="#172336">Blue: inputs   |   Amber: operation   |   Green: result / interpretation</text>
<text x="33" y="558" font-size="14" font-weight="normal" fill="#172336">Worked toy values explain the computation; they are not trained-model measurements.</text>
<text x="33" y="588" font-size="12" font-weight="normal" fill="#172336">Source: gameformer/model.py  |  Figure: map-segments</text>
</g></svg>
