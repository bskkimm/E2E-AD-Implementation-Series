[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gameformer-from-scratch"
version = "0.1.0"
description = "Readable GameFormer interaction prediction and planning in plain PyTorch"
requires-python = ">=3.11"
dependencies = ["torch>=2.9.1,<3", "numpy>=1.26,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
tracking = ["mlflow>=3.10,<4"]
dev = ["pytest>=8,<10", "ruff>=0.17,<0.18", "mypy>=1.15,<2", "pre-commit>=4,<5", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8", "build>=1.2,<2", "pip-audit>=2.9,<3", "nbstripout>=0.8,<1", "cairosvg>=2.8,<3", "pytest-cov>=6,<8"]

[project.scripts]
gameformer = "gameformer.cli:main"

[tool.setuptools.packages.find]
include = ["gameformer*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
files = ["gameformer/config.py", "gameformer/geometry.py", "gameformer/tracking.py"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

